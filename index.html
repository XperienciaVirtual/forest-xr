<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Forest XR - Gemini Live</title>
    <link type="text/css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xrblocks@0.11.0/samples/main.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
          "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
          "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
          "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
          "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
          "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
          "lit": "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js",
          "lit/": "https://esm.run/lit@3/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.11.0/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.11.0/build/addons/",
          "@google/genai": "https://cdn.jsdelivr.net/npm/@google/genai/+esm"
        }
      }
    </script>
  </head>
  <body>
    <!-- Overlay de API Key — solo aparece si no hay clave guardada -->
    <div id="apikey-overlay" style="display:none; position:fixed; inset:0; background:#0d1f0f; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; color:#fff;">
      <h2 style="margin-bottom:8px;">🌿 Forest XR</h2>
      <p style="margin-bottom:20px; color:#aaa; font-size:14px;">Introduce tu API key de <a href="https://aistudio.google.com" style="color:#4caf50;" target="_blank">Google AI Studio</a></p>
      <input id="apikey-input" type="password" placeholder="AIza..." style="padding:12px 16px; width:300px; border-radius:8px; border:none; font-size:16px; margin-bottom:12px;" />
      <button id="apikey-btn" style="padding:12px 24px; background:#1a6b1a; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer;">Entrar al bosque</button>
      <p id="apikey-error" style="color:#ff6b6b; margin-top:8px; display:none;">Clave inválida. Debe empezar por "AIza".</p>
    </div>
    <script>
      (function() {
        const overlay = document.getElementById('apikey-overlay');
        const input = document.getElementById('apikey-input');
        const btn = document.getElementById('apikey-btn');
        const err = document.getElementById('apikey-error');
        const saved = localStorage.getItem('gemini_api_key');
        if (!saved) {
          overlay.style.display = 'flex';
        }
        btn.addEventListener('click', function() {
          const key = input.value.trim();
          if (!key.startsWith('AIza')) { err.style.display = 'block'; return; }
          localStorage.setItem('gemini_api_key', key);
          overlay.style.display = 'none';
          // Arranca la app XR una vez que la clave está guardada
          if (window.__startXR) window.__startXR();
        });
      })();
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
